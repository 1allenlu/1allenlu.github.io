<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Applies the saved (or system) theme before first paint, so there's
         no flash of the wrong theme while the stylesheets load. -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {}
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery · Allen Lu</title>
    <meta name="description" content="A photo gallery by Allen Lu, with moments from NYC and beyond.">
    <link rel="canonical" href="https://1allenlu.github.io/gallery.html">
    <link rel="icon" type="image/svg+xml" href="assets/homepage/favicon.svg">
    <link rel="alternate icon" href="assets/homepage/favicon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body class="gallery-page">
    <!-- Header -->
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Allen Lu</a>
            <div class="nav-right">
                <ul class="nav-links">
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#education">Education</a></li>
                    <li><a href="index.html#experience">Experience</a></li>
                    <li><a href="index.html#skills">Skills</a></li>
                    <li><a href="index.html#projects">Projects</a></li>
                    <li><a href="gallery.html" class="nav-active">Gallery</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
                <button class="theme-toggle" id="themeToggle" aria-label="Switch to dark mode">
                    <span class="theme-icon theme-icon-sun" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
                    <span class="theme-icon theme-icon-moon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
                </button>
                <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Toggle menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </nav>
    </header>

    <main>
        <!-- Hero Section: doubles as the featured photo, full-bleed like a product page hero -->
        <section class="gallery-hero" id="galleryFeatured" tabindex="0" role="button" aria-label="View featured photo">
            <div class="gallery-hero-overlay"></div>
            <div class="container gallery-hero-content">
                <h1>Gallery</h1>
                <p>Moments, captured.</p>
                <!-- Stats strip -->
                <div class="gallery-stats">
                    <span id="statsCount">18 Photos</span>
                    <span class="stat-dot">·</span>
                    <span>NYC &amp; Beyond</span>
                    <span class="stat-dot">·</span>
                    <span>Through My Lens</span>
                </div>
            </div>
        </section>

        <!-- Gallery Grid -->
        <section class="gallery-section">
            <div class="container">
                <!-- Loading indicator -->
                <div class="loading-indicator">
                    <div class="loading-spinner"></div>
                    <p>Loading gallery...</p>
                </div>

                <!-- Gallery Grid (dynamically populated) -->
                <div class="gallery-grid" id="galleryGrid"></div>
            </div>
        </section>

        <!-- Lightbox Modal -->
        <div class="lightbox" id="lightbox">
            <div class="lightbox-content">
                <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
                <img class="lightbox-image" id="lightboxImage" src="" alt="">
                <div class="lightbox-info">
                    <h3 id="lightboxTitle"></h3>
                    <p id="lightboxCategory"></p>
                    <p class="lightbox-counter" id="lightboxCounter"></p>
                </div>
                <!-- Slideshow controls -->
                <div class="slideshow-controls">
                    <button class="slideshow-play-btn" id="slideshowBtn" aria-label="Play slideshow">&#9654;</button>
                    <div class="slideshow-progress-bar">
                        <div class="slideshow-progress-fill" id="slideshowFill"></div>
                    </div>
                </div>
                <!-- Filmstrip -->
                <div class="filmstrip-container">
                    <div class="filmstrip" id="filmstrip"></div>
                </div>
                <div class="lightbox-nav">
                    <button class="lightbox-prev" id="lightboxPrev">&#8249;</button>
                    <button class="lightbox-next" id="lightboxNext">&#8250;</button>
                </div>
            </div>
        </div>

        <!-- Keyboard shortcut hint (shown once) -->
        <div class="keyboard-hint" id="keyboardHint">
            <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &nbsp;&middot;&nbsp; <kbd>Esc</kbd> close
        </div>
    </main>

    <script src="gallery.js"></script>
</body>

</html>
