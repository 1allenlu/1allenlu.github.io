<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery - Allen Lu</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>
    <!-- Scroll Progress Bar -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Header -->
    <header>
        <nav class="container">
            <a href="index.html" class="logo">Allen Lu</a>
            <ul class="nav-links">
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#education">Education</a></li>
                <li><a href="index.html#experience">Experiences</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <div class="mobile-menu-toggle" id="mobileMenuToggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <!-- Hero Section -->
        <section class="gallery-hero">
            <div class="container">
                <h1>Photo Gallery</h1>
                <p>Capturing moments through my lens</p>
                <!-- Stats strip -->
                <div class="gallery-stats">
                    <span id="statsCount">18 Photos</span>
                    <span class="stat-dot">·</span>
                    <span>NYC &amp; Beyond</span>
                    <span class="stat-dot">·</span>
                    <span>Through My Lens</span>
                </div>
            </div>
        </section>

        <!-- Featured Photo Banner -->
        <div class="gallery-featured" id="galleryFeatured">
            <div class="gallery-featured-overlay">
                <span class="featured-tag">Featured</span>
                <p class="featured-count" id="featuredCount">Loading collection...</p>
            </div>
        </div>

        <!-- Gallery Grid -->
        <section class="gallery-section">
            <div class="container">
                <!-- Loading indicator -->
                <div class="loading-indicator">
                    <div class="loading-spinner"></div>
                    <p>Loading gallery...</p>
                </div>

                <!-- Gallery Grid (dynamically populated) -->
                <div class="gallery-grid" id="galleryGrid"></div>
            </div>
        </section>

        <!-- Lightbox Modal -->
        <div class="lightbox" id="lightbox">
            <div class="lightbox-content">
                <span class="lightbox-close">&times;</span>
                <img class="lightbox-image" id="lightboxImage" src="" alt="">
                <div class="lightbox-info">
                    <h3 id="lightboxTitle"></h3>
                    <p id="lightboxCategory"></p>
                    <p class="lightbox-counter" id="lightboxCounter"></p>
                </div>
                <!-- Slideshow controls -->
                <div class="slideshow-controls">
                    <button class="slideshow-play-btn" id="slideshowBtn" aria-label="Play slideshow">&#9654;</button>
                    <div class="slideshow-progress-bar">
                        <div class="slideshow-progress-fill" id="slideshowFill"></div>
                    </div>
                </div>
                <!-- Filmstrip -->
                <div class="filmstrip-container">
                    <div class="filmstrip" id="filmstrip"></div>
                </div>
                <div class="lightbox-nav">
                    <button class="lightbox-prev" id="lightboxPrev">&#8249;</button>
                    <button class="lightbox-next" id="lightboxNext">&#8250;</button>
                </div>
            </div>
        </div>

        <!-- Keyboard shortcut hint (shown once) -->
        <div class="keyboard-hint" id="keyboardHint">
            <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> navigate &nbsp;&middot;&nbsp; <kbd>Esc</kbd> close
        </div>
    </main>

    <!-- Back to Portfolio Button -->
    <div class="back-to-portfolio">
        <a href="index.html" class="btn btn-primary">&#8592; Back to Portfolio</a>
    </div>

    <!-- Scroll to Top -->
    <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top">&#8679;</button>

    <script src="gallery.js"></script>
</body>

</html>
